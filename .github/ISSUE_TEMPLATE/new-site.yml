name: New site
description: Add a BASE exit site to the OpenExit Commons without touching git
title: "[site] "
labels: ["new-site", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠ Read before submitting
        **Do not submit access-restricted or landowner-sensitive exits.** An issue is
        public and permanent even if closed — see
        [SENSITIVE-EXITS.md](../blob/main/SENSITIVE-EXITS.md). The public Commons holds
        openly-known sites only.

        All measurements in **metres**, directions in **degrees true**.
  - type: input
    id: name
    attributes:
      label: Site name
      description: The object (the cliff, the bridge), not one exit
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country (two-letter code, e.g. FR, CH, IT)
    validations:
      required: true
  - type: input
    id: coordinates
    attributes:
      label: Exit coordinates (lat, lon — WGS84 decimal degrees)
      placeholder: "45.812345, 6.423456"
    validations:
      required: true
  - type: dropdown
    id: objectType
    attributes:
      label: Object type
      options: [earth, building, antenna, span]
    validations:
      required: true
  - type: checkboxes
    id: suitability
    attributes:
      label: What can be jumped here?
      options:
        - label: slick (no wingsuit/tracksuit needed)
        - label: slider off
        - label: slider up
        - label: wingsuit
        - label: tracksuit
        - label: static line
  - type: input
    id: exitDirection
    attributes:
      label: Exit direction (degrees TRUE, 0-359)
  - type: input
    id: rockdrop
    attributes:
      label: Rockdrop (metres) + how measured + when
      placeholder: "220 m, laser, 2026-06"
  - type: input
    id: landing
    attributes:
      label: Landing coordinates (lat, lon) + surface
      placeholder: "45.814903, 6.428100 — grass"
  - type: textarea
    id: guide
    attributes:
      label: Access / approach / hazards (free text, any language)
  - type: dropdown
    id: access
    attributes:
      label: Legal status of access
      options: [legal, tolerated, restricted-seasonal, illegal, unknown]
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Contributor Terms (contributor-terms-2026-08)
      options:
        - label: >-
            I certify that I have the right to contribute this material and that it is
            not copied from a third-party database without permission. I keep my rights
            in my contribution, and I grant the OpenExit association a worldwide,
            non-exclusive, irrevocable licence to publish it as part of the OpenExit
            database under ODbL 1.0 (contents under DbCL 1.0), or under another free and
            open licence approved by a two-thirds vote of active contributors.
          required: true
        - label: This site is openly known — not access-restricted or landowner-sensitive.
          required: true
