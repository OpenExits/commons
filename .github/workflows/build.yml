# Regenerate build/ on merge to main.
#
# ci/** is in the path filter deliberately: the validator pin lives in
# ci/requirements.txt, and a change to what CI installs must re-prove that the
# build still runs. Leaving it out meant the first pin fix pushed green
# without ever being exercised.
name: build
on:
  push:
    branches: [main]
    paths: ["sites/**", "routes/**", "scripts/**", "ci/**"]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    # The job commits regenerated artifacts back, so it needs write on contents.
    # GITHUB_TOKEN defaults to read-only; declaring the single scope needed here
    # is preferable to switching the whole org to read-write by default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ci/requirements.txt
      - name: Rebuild artifacts
        run: python scripts/build_artifacts.py
      - name: Verify determinism and freshness
        run: python ci/run_gates.py --changed --check-build-fresh
      - name: Commit regenerated build
        run: |
          git config user.name "openexits-bot"
          git config user.email "bot@openexits.org"
          git add build/
          git diff --cached --quiet || git commit -m "chore(build): regenerate"
          git push
